[package]
name = "parl"
version = "0.2.0"
edition = "2024"

[[bin]]
name = "parl"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive", "env"] }
crossterm = { version = "0.28.1", features = ["event-stream"] }
dirs = "6.0.0"
futures = "0.3.34"
libc = "0.2.189"
nix = { version = "0.31.3", features = ["signal", "process"] }
nucleo-matcher = "0.3.1"
pulldown-cmark = "0.13.4"
rand = "0.10.2"
ratatui = "0.29.0"
regex = "1.13.1"
rmcp = { version = "3.1.4", features = ["server", "transport-io"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
textwrap = "0.16.2"
thiserror = "2.0.20"
time = { version = "0.3.55", features = ["formatting", "parsing", "macros", "serde-well-known"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "process", "io-util", "io-std", "fs", "sync", "time", "signal"] }
tui-textarea = "0.7.0"
unicode-width = "0.2.0"

[dev-dependencies]
assert_cmd = "2.2.2"
insta = "1.48.0"
predicates = "3.1.4"
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
unwrap_used = "deny"
todo = "deny"
dbg_macro = "deny"
